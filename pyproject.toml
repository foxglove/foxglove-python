[build-system]
requires = [
    "setuptools>=61",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "foxglove-client"
version = "0.22.0"
description = "Client library for the Foxglove API."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "arrow",
    # Require a CA bundle for requests that excludes the compromised emSign roots.
    "certifi>=2026.10.19",
    "mcap>=1.6.0",
    "requests",
    "typing_extensions",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/foxglove/foxglove-python"

[dependency-groups]
dev = [
    "black",
    "build",
    "faker",
    "flake8",
    "flake8-bugbear",
    "genmsg",
    "genpy",
    "mcap==1.6.0",
    "mcap-protobuf-support==0.6.0",
    "mcap-ros1-support==0.9.0",
    "mcap-ros2-support==0.6.0",
    "protobuf>=4.25,<5",
    "pyright",
    "pytest",
    "responses",
    "std_msgs",
]

[[tool.uv.index]]
name = "ros"
url = "https://rospypi.github.io/simple"
explicit = true

[tool.uv.sources]
"genmsg" = { index = "ros" }
"genpy" = { index = "ros" }
"std-msgs" = { index = "ros" }

[tool.black]
extend-exclude = ".*_pb2.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["foxglove*"]

[tool.setuptools.package-data]
# foxglove-sdk (https://github.com/foxglove/foxglove-sdk) owns root foxglove files.
# Keep the marker here so uninstalling this client cannot remove the SDK marker.
"foxglove.client" = ["py.typed"]
